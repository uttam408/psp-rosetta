# Luftrauser (Vlambeer, 2011) — Flash / AS3, 2D.
# Source: decompile the SWF with JPEXS ("Export all parts") and point `crawl --src`
# at the export directory.

[game]
name = "Luftrauser"
adapter = "flash"

[crawl]
# FlashPunk's built-in debug console + Flex asset wrappers ship inside the SWF but
# aren't game content.
exclude = [
  "*net_flashpunk_debug*",
  "*console*",
  "*FONT_DEFAULT*",
]

[screen]
native = [480, 320]   # FlashPunk Engine(480, 320, 30, fixed) — see Main.as
target = [480, 272]   # PSP. Native rebuild, NOT a crop/scale: the game is fully
                      # world-space + camera-relative and keys off FP.width/height,
                      # so setting the engine to 480x272 just makes the view 48px
                      # shorter. No game-logic constants depend on 320.

[convert.textures]
max_size = 256
format = "rgba5551"   # game art is mostly hard-edged 1-bit alpha; 16bpp halves VRAM
swizzle = true
pot = true

[convert.audio]
sample_rate = 22050        # SFX
music_sample_rate = 32000
music_bitrate = "80k"
music_min_seconds = 8.0    # clips longer than this are treated as music
